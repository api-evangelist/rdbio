name: rdbio (仁度生物 / Rendo Biotech)
description: Rendo Biotech (仁度生物) is a Shanghai-based molecular diagnostics company
  founded in 2007 and listed on China's STAR Market (Science and Technology Innovation
  Board, stock code 688193). It specializes in pathogen RNA clinical detection, developing
  diagnostic reagents and fully automated nucleic-acid analysis instruments across five
  clinical areas — reproductive-health screening, bloodborne pathogen detection, respiratory
  infections, enterovirus identification, and food safety. The company serves 700+ medical
  institutions and holds 74+ invention patents. It was surfaced as a portfolio company of
  the Qiming Venture Partners network and added to the API Evangelist network. As of this
  enrichment pass, Rendo Biotech publishes no public developer API, OpenAPI definition,
  SDK, or documentation surface — it is a diagnostics-instrument and reagents manufacturer,
  not an API provider.
